  <style>
    :root{
      --bg:#0a0e0a; --surface:#111711; --accent:#6dbf67; --accent-soft:#8fd98a;
      --text:#e8ede8; --text-muted:#9aaa9a; --border:rgba(109,191,103,0.15);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      background:var(--bg); color:var(--text);
      font-family:'Outfit',sans-serif; font-weight:300;
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; justify-content:center; text-align:center;
      padding:2rem; overflow-x:hidden; position:relative;
    }
    body::before{
      content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(109,191,103,0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 70%, rgba(109,191,103,0.04) 0%, transparent 55%);
    }
    .wrap{position:relative; z-index:1; max-width:560px}
    .logo{
      display:inline-flex; align-items:center; gap:0.5rem;
      margin-bottom:2.5rem; text-decoration:none;
    }
    .logo img{width:40px;height:40px;object-fit:contain}
    .logo-iu{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:0.1em;color:var(--accent);line-height:1}
    .logo-name{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:0.1em;color:var(--text-muted);line-height:1}
    .code{
      font-family:'Bebas Neue',sans-serif; font-size:clamp(6rem,22vw,11rem);
      line-height:0.9; color:var(--accent); letter-spacing:0.03em;
    }
    h1{
      font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:500;
      font-size:clamp(1.5rem,4vw,2.2rem); margin:0.5rem 0 1rem;
    }
    p{color:var(--text-muted); font-size:1.05rem; line-height:1.7; margin-bottom:2.5rem}
    .actions{display:flex; gap:1rem; justify-content:center; flex-wrap:wrap}
    .btn{
      display:inline-flex; align-items:center; gap:0.5rem;
      padding:0.9rem 2rem; font-size:0.82rem; font-weight:500;
      letter-spacing:0.1em; text-transform:uppercase; text-decoration:none;
      transition:background .28s,color .28s,border-color .28s,transform .28s;
    }
    .btn-primary{background:var(--accent);color:var(--bg);border:1px solid var(--accent)}
    .btn-primary:hover{background:var(--accent-soft);border-color:var(--accent-soft);transform:translateY(-2px)}
    .btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
    .btn-ghost:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
    .links{margin-top:2.5rem;font-size:0.85rem;color:var(--text-muted)}
    .links a{color:var(--accent);text-decoration:none;margin:0 0.5rem}
    .links a:hover{color:var(--accent-soft);text-decoration:underline}
  </style>
